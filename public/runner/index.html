<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11110f">
  <title>PEPEPOW Auto-Shooting Runner v0.3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <div><span class="mark">PP</span><strong>PEPEPOW RUNNER</strong></div>
      <div class="header-actions"><span class="version">v0.3 · OFF-CHAIN</span><button class="fullscreen" id="fullscreen" type="button" aria-label="Toggle fullscreen">⛶ FULLSCREEN</button></div>
    </header>
    <section class="hud" aria-label="Game status">
      <div><small>SCORE</small><strong id="score">00000</strong></div>
      <div><small>BEST</small><strong id="best">00000</strong></div>
      <div><small>WEAPON</small><strong id="weapon">PULSE · L1</strong></div>
      <div><small>LIFE</small><strong id="life">●●●</strong></div>
    </section>
    <div class="canvas-wrap">
      <canvas id="game" width="430" height="650" aria-label="PEPEPOW auto-shooting runner"></canvas>
      <div class="overlay" id="overlay">
        <span id="eyebrow">RUNNER · V0.3</span>
        <h1 id="title">AUTO-SHOOTING<br>RUNNER</h1>
        <p id="message">Fight soldiers · beat the mini-boss · destroy the final boss</p>
        <button id="start" type="button">START RUN →</button>
      </div>
    </div>
    <footer>
      <span>← → / A D</span><p>Desktop</p><span>DRAG</span><p>Phone</p>
      <b>+P power · S spread · R rapid · ◆ shield</b>
    </footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
